            position: sticky;
            top: 100px;
        }
        .sidebar h3 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;

        }
        .main-content {
            flex: 1;
        }
        .filter-group {
            margin-bottom: 20px;
        }

            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .search-bar {
            margin-bottom: 30px;
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }
        .search-bar input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px var(--info-bg);
            background: var(--white);
        }
        @media (max-width: 768px) {
            .listings-layout {
                flex-direction: column;
            }
            .sidebar {
                flex: none;
                width: 100%;
                position: static;
                margin-bottom: 20px;
            }
        }

                    <optgroup label="Southern Province">
                        <option value="Galle">Galle</option>
                        <option value="Matara">Matara</option>
                        <option value="Hambantota">Hambantota</option>
                    </optgroup>
                    <optgroup label="North Western Province">
                        <option value="Kurunegala">Kurunegala</option>
                        <option value="Puttalam">Puttalam</option>
                    </optgroup>
                    <optgroup label="Northern Province">
                        <option value="Jaffna">Jaffna</option>

                        <option value="Mannar">Mannar</option>

                    </optgroup>
                    <optgroup label="Eastern Province">

                    </optgroup>

        <main class="main-content">

                <input type="text" id="search-input" placeholder="Ã°Å¸â€Â Search by keyword, business name, or description...">

        <!-- Firebase Core SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js?v=11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('listings-grid');
            const searchInput = document.getElementById('search-input');
            const industryFilter = document.getElementById('filter-industry');
            const locationFilter = document.getElementById('filter-location');
            const stageFilter = document.getElementById('filter-stage');

            let listings = await store.getPublished();

            if (locationFilter) {
                const activeLocations = [...new Set(listings.map(l => l.district).filter(Boolean))].sort();
                locationFilter.innerHTML = '<option value="">All of Sri Lanka</option>';
                activeLocations.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc;
                    opt.textContent = loc;
                    locationFilter.appendChild(opt);
                });
            }

            if (industryFilter && typeof categoryStore !== 'undefined') {
                const categories = categoryStore.getAll();
                categories.forEach(cat => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = cat.name;
                    (cat.subgroups || []).forEach(group => {
                        (group.items || []).forEach(item => {
                            const opt = document.createElement('option');
                            opt.value = item;
                            opt.textContent = item;
                            optgroup.appendChild(opt);
                        });
                    });
                    industryFilter.appendChild(optgroup);
                });
            }

            async function renderListings() {
                const keyword = searchInput.value.toLowerCase();
                const industry = industryFilter.value;
                const loc = locationFilter.value;
                const stage = stageFilter.value;

                let listings = await store.getPublished();

                if (keyword) {
                    listings = listings.filter(l => 
                        l.businessName.toLowerCase().includes(keyword) || 
                        l.shortDescription.toLowerCase().includes(keyword)
                    );
                }
                if (industry) {
                    listings = listings.filter(l => l.industry === industry);
                }
                if (loc) {
                    listings = listings.filter(l => l.district === loc);
                }
                if (stage) {
                    listings = listings.filter(l => l.businessStage === stage);
                }

                if (listings.length === 0) {
                    grid.innerHTML = '<div style="background: var(--white); padding: 40px; border-radius: 12px; text-align: center; grid-column: 1/-1; border: 1px solid var(--border-color);"><p style="color: var(--text-muted); font-size: 1.1rem;">No listings found matching your criteria.</p></div>';
                    return;
                }

                grid.innerHTML = listings.map(l => `
                    <div class="listing-card">
                        <div class="card-img-container">
                            <span class="card-badge-top">${l.industry}</span>
                            <span>[Image Placeholder]</span>
                        </div>
                        <div class="card-header">
                            <a href="listing-detail.html?id=${l.id}" class="card-title">${l.businessName}</a>
                            <div class="card-meta">
                                <span>Ã°Å¸â€œÂ ${l.district}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="card-desc">${l.shortDescription}</p>
                            <div class="card-data-grid">
                                <div>
                                    <div class="data-label">Investment Req.</div>
                                    <div class="data-value">${formatLKR(l.investmentRequired)}</div>
                                </div>
                                <div>
                                    <div class="data-label">Stage</div>
                                    <div class="data-value" style="color: var(--text-main); font-weight: 600;">${l.businessStage}</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span style="font-size: 0.85rem; color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 5px;">
                                <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                Verified
                            </span>
                            <a href="listing-detail.html?id=${l.id}" class="btn btn-primary" style="padding: 6px 14px; font-size: 0.85rem; box-shadow: none;">View Details</a>
                        </div>
                    </div>
                `).join('');
            }

            searchInput.addEventListener('input', renderListings);
            industryFilter.addEventListener('change', renderListings);
            locationFilter.addEventListener('change', renderListings);
            stageFilter.addEventListener('change', renderListings);

            renderListings();
        });
    </script>
