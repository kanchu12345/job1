<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Detail | HelaInvest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-layout {
            display: flex;
            gap: 3rem;
        }
        .detail-main {
            flex: 2;
        }
        .detail-sidebar {
            flex: 1;
        }
        .gallery-placeholder {
            width: 100%;
            height: 400px;
            background: var(--card-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }
        .info-card h3 {
            margin-bottom: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .data-item label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .data-item p {
            font-weight: 500;
        }
        .breadcrumb {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .breadcrumb a {
            color: var(--accent-color);
        }
        @media (max-width: 768px) {
            .detail-layout {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HelaInvest.</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="listings.html">Browse Businesses</a></li>
                <li><a href="submit.html">Add Business</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" id="detail-container">
        <!-- Populated by JS -->
    </div>

    <footer>
        <div class="logo" style="margin-bottom: 1rem;">HelaInvest.</div>
        <p>&copy; 2026 HelaInvest Platform. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('detail-container');

            if (!id) {
                container.innerHTML = '<p>No listing ID provided.</p>';
                return;
            }

            const listing = store.getById(id);

            if (!listing || listing.status !== 'published') {
                container.innerHTML = '<p>Listing not found or not currently published.</p>';
                return;
            }

            container.innerHTML = `
                <div class="breadcrumb">
                    <a href="listings.html">← Back to Listings</a>
                </div>

                <div class="detail-layout">
                    <div class="detail-main">
                        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">${listing.businessName}</h1>
                        <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 2rem;">${listing.shortDescription}</p>

                        <div class="gallery-placeholder">
                            [Business Images Gallery]
                        </div>

                        <div class="info-card">
                            <h3>About the Business</h3>
                            <p style="white-space: pre-line;">${listing.fullDescription}</p>
                        </div>
                    </div>

                    <div class="detail-sidebar">
                        <div class="info-card">
                            <h3>Investment Details</h3>
                            <div class="data-grid">
                                <div class="data-item">
                                    <label>Required Investment</label>
                                    <p style="color: var(--accent-color); font-size: 1.2rem;">${formatLKR(listing.investmentRequired)}</p>
                                </div>
                                <div class="data-item">
                                    <label>Min. Investment</label>
                                    <p>${listing.minimumInvestment ? formatLKR(listing.minimumInvestment) : 'Negotiable'}</p>
                                </div>
                                <div class="data-item">
                                    <label>Industry</label>
                                    <p>${listing.industry}</p>
                                </div>
                                <div class="data-item">
                                    <label>Stage</label>
                                    <p>${listing.businessStage}</p>
                                </div>
                                <div class="data-item" style="grid-column: 1/-1;">
                                    <label>Location</label>
                                    <p>${listing.district}</p>
                                </div>
                            </div>
                        </div>

                        <div class="info-card">
                            <h3>Contact Information</h3>
                            <div class="data-item" style="margin-bottom: 1rem;">
                                <label>Contact Person</label>
                                <p>${listing.contactName}</p>
                            </div>
                            <div class="data-item" style="margin-bottom: 1rem;">
                                <label>Phone</label>
                                <p><a href="tel:${listing.phone}" style="color: var(--text-primary); text-decoration: underline;">${listing.phone}</a></p>
                            </div>
                            <div class="data-item">
                                <label>Email</label>
                                <p><a href="mailto:${listing.email}" style="color: var(--text-primary); text-decoration: underline;">${listing.email}</a></p>
                            </div>
                        </div>

                        <div class="services-promo" style="margin: 0; padding: 1.5rem; text-align: left;">
                            <h4 style="margin-bottom: 0.5rem; color: var(--accent-color);">Need Help Structuring Your Deal?</h4>
                            <p style="font-size: 0.9rem; margin-bottom: 1rem;">Our experts can assist with valuation and structuring.</p>
                            <a href="#" class="btn btn-outline" style="width: 100%; text-align: center;">Get Advisory Support</a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
