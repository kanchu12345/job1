<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | HelaInvest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f0f0f0; font-family: Arial, sans-serif; }
        .tj-header { background: #fff; border-bottom: 3px solid #003399; padding: 10px 0; }
        .tj-header .inner { max-width: 1140px; margin: 0 auto; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; }
        .tj-logo { font-size: 1.8rem; font-weight: 900; color: #003399; text-decoration: none; }
        .tj-logo span { color: #cc9900; }
        .content-page { max-width: 1140px; margin: 20px auto; background: #fff; padding: 40px; border: 1px solid #ccc; min-height: 400px; }
        .tj-footer { background: #fff; border-top: 2px solid #003399; padding: 20px 0; margin-top: 20px; }
        .tj-footer .inner { max-width: 1140px; margin: 0 auto; padding: 0 10px; text-align: center; }
        .tj-footer-links { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
        .tj-footer-links a { color: #003399; text-decoration: none; font-size: 0.85rem; }
        .contact-form { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background: #003399; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">





    

    <div class="content-page">
        <h1>Contact Us</h1>
        <div class="contact-form">
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your Name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Your Email">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="Your Message"></textarea>
            </div>
            <button class="btn-submit">Send Message</button>
        </div>
    </div>

    



</html>
