    <!-- Resilient Script Loader -->
    <script>
    // Helper to dynamically load external scripts with timeouts
    function loadScript(src, timeoutMs = 4000) {
        return new Promise((resolve, reject) => {
            var s = document.createElement('script');
            s.src = src;
            s.async = true;
            
            var timer = setTimeout(function() {
                s.onerror = null;
                s.onload = null;
                reject(new Error("Timeout loading " + src));
            }, timeoutMs);
            
            s.onload = function() {
                clearTimeout(timer);
                resolve();
            };
            s.onerror = function() {
                clearTimeout(timer);
                reject(new Error("Failed to load " + src));
            };
            document.head.appendChild(s);
        });
    }

    // Sequence load scripts to maintain dependencies
    async function initScripts() {
        try {
            console.log("Loading Firebase SDKs dynamically in parallel...");
            await Promise.all([
                loadScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js", 2000),
                loadScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js", 2000),
                loadScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js", 2000)
            ]);
            console.log("Firebase SDKs loaded successfully.");
        } catch (e) {
            console.warn("Could not load Firebase CDN scripts, running in local fallback mode:", e);
        }

        // Load local configurations and application logic
        try {
            await loadScript("firebase-config.js", 2000);
            await loadScript("app.js", 2000);
            console.log("Application scripts initialized.");
            
            // Execute the page logic after scripts are loaded
            if (typeof window.initializePage === 'function') {
                window.initializePage();
            }
        } catch (e) {
            console.error("Critical error loading local scripts:", e);
        }
    }
    
    // Start script initialization immediately
    initScripts();
    </script>
<script>
// Main page controller
window.initializePage = async function() {
    // Prevent double execution
    if (window.pageInitialized) return;
    window.pageInitialized = true;
    
    // Load Font-Awesome dynamically to prevent HTML parser blocking
    try {
        var fa = document.createElement('link');
        fa.rel = 'stylesheet';
        fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
        document.head.appendChild(fa);
    } catch(e) {
        console.warn("Failed to load Font Awesome dynamically:", e);
    }
    
    console.log("Initializing page content...");
    const tbody = document.querySelector('.tj-table tbody');
    const searchInput = document.getElementById('sidebar-search-input');
    const searchBtn = document.getElementById('sidebar-search-btn');
    const filterIndustry = document.getElementById('filter-industry');
    const filterLocation = document.getElementById('filter-location');
    const filterInvestMin = document.getElementById('filter-invest-min');
    const filterInvestMax = document.getElementById('filter-invest-max');
    const btnClearFilters = document.getElementById('btn-clear-filters');
    
    let activeMainCategoryIndex = 0;
    let selectedSubcategory = '';

    const categories = categoryStore.getAll() || [];
    const icons = ['fa-leaf', 'fa-laptop-code', 'fa-industry', 'fa-hotel', 'fa-truck', 'fa-briefcase-medical', 'fa-bars'];
    const iconColors = ['#16a34a', '#2563eb', '#d97706', '#db2777', '#7c3aed', '#0891b2', '#64748b'];

    const sidebarContainer = document.getElementById('sidebar-container');

    window.renderSidebarMain = function() {
        if (!sidebarContainer) return;
        let html = `
            <h3 style="font-size: 1.1rem; color: #fff; margin: 0; padding: 18px 15px; background: #0a3578; text-align: left; font-weight: bold; border-bottom: 3px solid #cc9900;">Business Categories</h3>
            <ul style="list-style: none; padding: 0; margin: 0;">
        `;
        html += categories.map((c, index) => `
            <li>
                <a href="#" onclick="openSidebarCategory(event, ${index})" style="display: block; padding: 14px 20px; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; font-weight: 500; transition: background 0.2s;" onmouseover="this.style.background='#003399'; this.style.color='#cc9900'; this.style.paddingLeft='25px';" onmouseout="this.style.background='transparent'; this.style.color='#fff'; this.style.paddingLeft='20px';">
                    ${(c.name || '').replace(/&/g, '&amp;')}
                </a>
            </li>
        `).join('');
        html += `</ul>`;
        sidebarContainer.innerHTML = html;
        sidebarContainer.style.background = '#0d47a1';
        sidebarContainer.style.padding = '0';
        sidebarContainer.style.borderRadius = '8px';
        sidebarContainer.style.boxShadow = '0 4px 15px rgba(0,0,0,0.1)';
        sidebarContainer.style.border = 'none';
        sidebarContainer.style.overflow = 'hidden';
        sidebarContainer.style.position = 'sticky';
        sidebarContainer.style.top = '40px';
        sidebarContainer.style.zIndex = '100';
    };

    window.renderSidebarSub = function(index) {
        if (!sidebarContainer) return;
        const c = categories[index];
        if (!c) return;
        
        let html = `
            <div style="background: #0a3578; padding: 15px;">
                <a href="#" onclick="goBackToMainCategories(event)" style="display: inline-block; color: #cc9900; font-size: 0.85rem; text-decoration: none; margin-bottom: 10px; font-weight: 600;">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <h3 style="font-size: 1.05rem; color: #fff; margin: 0; font-weight: bold;">
                    ${(c.name || '')}
                </h3>
            </div>
            <ul style="list-style: none; padding: 0; margin: 0; max-height: 500px; overflow-y: auto;">
        `;
        
        (c.subgroups || []).forEach(group => {
            if (group.name) {
                html += `<li style="font-weight: 700; color: #cc9900; font-size: 0.8rem; text-transform: uppercase; margin: 10px 0 5px 0; padding: 0 20px;">${group.name}</li>`;
            }
            (group.items || []).forEach(item => {
                const isActive = (selectedSubcategory === item);
                const bg = isActive ? '#003399' : 'transparent';
                const col = isActive ? '#cc9900' : '#fff';
                
                html += `
                <li>
                    <a href="#" onclick="selectSidebarSubcategory(event, '${item.replace(/'/g, "\\'")}', ${index})" style="display: block; padding: 10px 20px 10px 30px; color: ${col}; text-decoration: none; font-size: 0.9rem; background: ${bg}; transition: background 0.2s;" onmouseover="this.style.background='#003399'; this.style.color='#cc9900';" onmouseout="if(!${isActive}){this.style.background='transparent'; this.style.color='#fff';}">
                        ${item}
                    </a>
                </li>`;
            });
        });
        
        html += `</ul>`;
        sidebarContainer.innerHTML = html;
        sidebarContainer.style.background = '#0d47a1';
        sidebarContainer.style.padding = '15px 0';
        sidebarContainer.style.borderRadius = '8px';
        sidebarContainer.style.boxShadow = '0 4px 15px rgba(0,0,0,0.1)';
        sidebarContainer.style.border = 'none';
        sidebarContainer.style.position = 'sticky';
        sidebarContainer.style.top = '40px';
        sidebarContainer.style.zIndex = '100';
    };

    window.openSidebarCategory = function(e, index) {
        e.preventDefault();
        renderSidebarSub(index);
    };

    window.goBackToMainCategories = function(e) {
        if (e) e.preventDefault();
        selectedSubcategory = '';
        renderSidebarMain();
        
        applyFilters();
    };

    window.selectSidebarSubcategory = function(e, subcat, mainIndex) {
        e.preventDefault();
        selectedSubcategory = subcat;
        filterIndustry.value = subcat; 

        applyFilters();
        renderSidebarSub(mainIndex); // re-render to highlight selection
    };

    // Initial render
    renderSidebarMain();
    
    // Get listings from store
    let allListings = [];
    try {
        await store.seedDummyListings();
        allListings = await store.getPublished();
    } catch (e) {
        console.error("Error loading listings from database:", e);
        if (store && store.getLocalListings) {
            allListings = store.getLocalListings().filter(l => l.status === 'published');
        }
    }

    // Populate filter dropdowns from published listings data
    try {
        // We keep the hardcoded locations in HTML to cover all of Sri Lanka
    } catch (e) {
        console.error("Error populating dropdown filters:", e);
    }
    
    function renderListings(listings) {
        tbody.innerHTML = '';
        if (listings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">No businesses found matching your criteria.</td></tr>';
            return;
        }
        
        if (window.location.hash) {
            const industry = decodeURIComponent(window.location.hash.substring(1));
            filterIndustry.value = industry;
        }

        // Populate industry dropdown from categoryStore
        if (filterIndustry && typeof categoryStore !== 'undefined') {
            const categories = categoryStore.getAll();
            categories.forEach(cat => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = cat.name;
                (cat.subgroups || []).forEach(group => {
                    (group.items || []).forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item;
                        opt.textContent = item;
                        optgroup.appendChild(opt);
                    });
                });
                filterIndustry.appendChild(optgroup);
            });
        }
        
        listings.forEach(listing => {
            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.onclick = () => window.location.href = `listing-detail.html?id=${listing.id}`;
            
            if(listing.boosted) {
                tr.style.backgroundColor = '#fffbea';
            }
            // Add hover effect
            tr.onmouseover = function() { this.style.backgroundColor = listing.boosted ? '#fef3c7' : '#f8fafc'; }
            tr.onmouseout = function() { this.style.backgroundColor = listing.boosted ? '#fffbea' : 'transparent'; }
            
            const boostBadge = listing.boosted ? '<span style="color:#f59e0b; margin-right:5px;" title="Boosted Ad">â­</span> ' : '';
            const shortDesc = listing.shortDescription || listing.shortdesc || listing.fullDescription || '';
            const descSnippet = shortDesc.length > 60 ? shortDesc.substring(0, 60) + '...' : shortDesc;
            
            tr.innerHTML = `
                <td style="font-weight:600;">${formatLKR(listing.investmentRequired)}</td>
                <td>${listing.businessStage || 'N/A'}</td>
                <td class="biz-title">
                    ${boostBadge}<span ${listing.boosted ? 'style="font-weight:700; color:#b45309;"' : 'style="font-weight:600; color:#0d47a1;"'}>${descSnippet}</span>
                </td>
                <td>${listing.district || 'N/A'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Initial render
    renderListings(allListings);

    const filterStage = document.getElementById('filter-stage');
    const filterSort = document.getElementById('filter-sort');

    // Combined filter + search function
    function applyFilters() {
        const keyword = (searchInput ? searchInput.value : '').toLowerCase().trim();
        const industry = filterIndustry.value || selectedSubcategory; // Include selectedSubcategory
        const location = filterLocation.value;
        const investMin = Number(filterInvestMin.value) || 0;
        const investMax = filterInvestMax.value ? Number(filterInvestMax.value) : Infinity;
        const stage = filterStage ? filterStage.value : '';
        const sort = filterSort ? filterSort.value : '';

        let filtered = allListings.filter(l => {
            // Keyword filter
            if (keyword) {
                const matchKeyword = (l.businessName && l.businessName.toLowerCase().includes(keyword)) ||
                    (l.shortDescription && l.shortDescription.toLowerCase().includes(keyword)) ||
                    (l.fullDescription && l.fullDescription.toLowerCase().includes(keyword)) ||
                    (l.industry && l.industry.toLowerCase().includes(keyword)) ||
                    (l.district && l.district.toLowerCase().includes(keyword));
                if (!matchKeyword) return false;
            }
            // Industry filter (exact or substring match for subcategories)
            if (industry) {
                const indMatch = l.industry && (
                    l.industry.toLowerCase() === industry.toLowerCase() ||
                    industry.toLowerCase().includes(l.industry.toLowerCase()) ||
                    l.industry.toLowerCase().includes(industry.toLowerCase())
                );
                if (!indMatch) return false;
            }
            // Location filter
            if (location && l.district !== location) return false;
            
            // Stage filter
            if (stage && l.businessStage !== stage) return false;
            

            // Investment range filter
            const investAmt = Number(l.investmentRequired) || 0;
            if (investAmt < investMin) return false;
            if (investMax !== Infinity && investAmt > investMax) return false;
            return true;
        });

        // Sorting
        if (sort === 'newest') {
            filtered.sort((a, b) => new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0));
        } else if (sort === 'price-asc') {
            filtered.sort((a, b) => (Number(a.investmentRequired) || 0) - (Number(b.investmentRequired) || 0));
        } else if (sort === 'price-desc') {
            filtered.sort((a, b) => (Number(b.investmentRequired) || 0) - (Number(a.investmentRequired) || 0));
        }

        renderListings(filtered);
    }

    // Event listeners for filters
    if (searchBtn) searchBtn.addEventListener('click', applyFilters);
    if (searchInput) searchInput.addEventListener('keyup', applyFilters);
    filterIndustry.addEventListener('change', () => {
        selectedSubcategory = ''; // clear modal selection if dropdown used
        if (btnOpenCategoryModal) btnOpenCategoryModal.innerHTML = 'Category <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>';
        applyFilters();
    });
    filterLocation.addEventListener('change', applyFilters);
    filterInvestMin.addEventListener('input', applyFilters);
    filterInvestMax.addEventListener('input', applyFilters);
    if (filterStage) filterStage.addEventListener('change', applyFilters);
    if (filterSort) filterSort.addEventListener('change', applyFilters);
    
    btnClearFilters.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        filterIndustry.value = '';
        filterLocation.value = '';
        filterInvestMin.value = '0';
        filterInvestMax.value = '';
        if (filterStage) filterStage.value = '';
        if (filterSort) filterSort.value = '';
        selectedSubcategory = '';
        if (btnOpenCategoryModal) btnOpenCategoryModal.innerHTML = 'Category <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>';
        renderListings(allListings);
    });

};
</script>
