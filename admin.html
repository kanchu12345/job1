<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HelaInvest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-login {
            max-width: 400px;
            margin: 100px auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
        }
        .admin-login input {
            width: 100%;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 5px;
            background: var(--bg-color);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        
        #admin-panel {
            display: none; /* Hidden by default until login */
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-card h3 {
            font-size: 2rem;
            color: var(--accent-color);
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
        }
        .admin-table th, .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .admin-table th {
            background: rgba(0,0,0,0.2);
            font-weight: 600;
            color: var(--text-muted);
        }
        
        .status-badge {
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-published { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .action-btn {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            font-weight: 600;
        }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-delete { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HelaInvest Admin.</div>
        <nav>
            <ul>
                <li><a href="index.html">← Back to Site</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        
        <!-- Login Screen -->
        <div id="login-screen" class="admin-login">
            <h2>Admin Login</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Enter PIN (Demo: hela2024)</p>
            <input type="password" id="admin-pin" placeholder="Enter PIN">
            <button id="login-btn" class="btn btn-primary" style="width: 100%;">Login</button>
            <p id="login-error" style="color: var(--danger); margin-top: 1rem; display: none;">Invalid PIN</p>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-panel">
            <h1 style="margin-bottom: 2rem;">Dashboard Overview</h1>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3 id="stat-total">0</h3>
                    <p>Total Submissions</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-pending">0</h3>
                    <p>Pending Review</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-published">0</h3>
                    <p>Published</p>
                </div>
                <div class="stat-card">
                    <h3 id="stat-rejected">0</h3>
                    <p>Rejected</p>
                </div>
            </div>

            <h2 style="margin-bottom: 1rem; margin-top: 3rem;">Manage Listings</h2>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Industry</th>
                            <th>Requested (LKR)</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1rem; color: var(--accent-color);"></h2>
            <div id="modal-body" style="margin-bottom: 2rem; font-size: 0.9rem;"></div>
            <button class="btn btn-outline" onclick="document.getElementById('detail-modal').style.display='none'">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Login Logic
            document.getElementById('login-btn').addEventListener('click', () => {
                const pin = document.getElementById('admin-pin').value;
                if (pin === 'hela2024') {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    renderAdmin();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            });

            // Make actions global so inline onclick works
            window.changeStatus = function(id, newStatus) {
                store.update(id, { status: newStatus });
                renderAdmin();
            };

            window.deleteListing = function(id) {
                if(confirm("Are you sure you want to delete this listing permanently?")) {
                    let listings = store.getAll();
                    listings = listings.filter(l => l.id !== id);
                    localStorage.setItem('hela_listings', JSON.stringify(listings));
                    renderAdmin();
                }
            };

            window.viewDetails = function(id) {
                const listing = store.getById(id);
                if(!listing) return;

                document.getElementById('modal-title').innerText = listing.businessName;
                
                let servicesHTML = listing.services && listing.services.length > 0 
                    ? `<ul style="margin-left: 1.5rem; color: var(--accent-color);">
                        ${listing.services.map(s => `<li>${s}</li>`).join('')}
                       </ul>`
                    : '<p>No services requested.</p>';

                document.getElementById('modal-body').innerHTML = `
                    <p><strong>Contact Name:</strong> ${listing.contactName}</p>
                    <p><strong>Phone:</strong> ${listing.phone}</p>
                    <p><strong>Email:</strong> ${listing.email}</p>
                    <p><strong>Location:</strong> ${listing.district}</p>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 1rem 0;">
                    <p><strong>Short Desc:</strong> ${listing.shortDescription}</p>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 1rem 0;">
                    <h4 style="margin-bottom: 0.5rem;">Requested Professional Services:</h4>
                    ${servicesHTML}
                    <p style="margin-top: 0.5rem;"><strong>Notes:</strong> ${listing.additionalNotes || 'N/A'}</p>
                `;
                document.getElementById('detail-modal').style.display = 'flex';
            };

            function renderAdmin() {
                const listings = store.getAll().reverse(); // Newest first
                
                // Update stats
                document.getElementById('stat-total').innerText = listings.length;
                document.getElementById('stat-pending').innerText = listings.filter(l => l.status === 'pending').length;
                document.getElementById('stat-published').innerText = listings.filter(l => l.status === 'published').length;
                document.getElementById('stat-rejected').innerText = listings.filter(l => l.status === 'rejected').length;

                // Render table
                const tbody = document.getElementById('admin-tbody');
                
                if (listings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No submissions found.</td></tr>';
                    return;
                }

                tbody.innerHTML = listings.map(l => {
                    const date = new Date(l.submittedAt).toLocaleDateString();
                    
                    let actionButtons = '';
                    if (l.status === 'pending') {
                        actionButtons = `
                            <button class="action-btn btn-approve" onclick="changeStatus('${l.id}', 'published')">Approve</button>
                            <button class="action-btn btn-reject" onclick="changeStatus('${l.id}', 'rejected')">Reject</button>
                        `;
                    } else if (l.status === 'published') {
                        actionButtons = `<button class="action-btn btn-reject" onclick="changeStatus('${l.id}', 'rejected')">Unpublish</button>`;
                    } else if (l.status === 'rejected') {
                        actionButtons = `<button class="action-btn btn-approve" onclick="changeStatus('${l.id}', 'published')">Publish</button>`;
                    }

                    return `
                        <tr>
                            <td>
                                <strong>${l.businessName}</strong>
                                <div style="font-size: 0.8rem; color: var(--accent-color); cursor: pointer; margin-top: 0.2rem;" onclick="viewDetails('${l.id}')">View Full Details</div>
                            </td>
                            <td>${l.industry}</td>
                            <td>${formatLKR(l.investmentRequired)}</td>
                            <td><span class="status-badge status-${l.status}">${l.status.toUpperCase()}</span></td>
                            <td>${date}</td>
                            <td>
                                ${actionButtons}
                                <button class="action-btn btn-delete" onclick="deleteListing('${l.id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        });
    </script>
</body>
</html>
